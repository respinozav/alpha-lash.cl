# ==============================================================================
# CONFIGURACIÓN POSTGREST PARA ALPHA LASH (alpha-lash.cl)
# Puerto interno: 8005
# Esquema: bdalpha-lash
# ==============================================================================

# Cadena de conexión URI a PostgreSQL (ajustar con credenciales del servidor)
db-uri = "postgres://authenticator:tu_clave_segura_postgrest@localhost:5432/postgres"

# Esquema de la base de datos expuesto en la API REST
db-schemas = "bdalpha-lash"

# Rol para solicitudes anónimas (lectura pública de catálogo y clientes)
db-anon-role = "web_anon"

# Puerto de escucha del servicio PostgREST
server-port = 8005
server-host = "127.0.0.1"

# Cantidad máxima de filas retornadas por consulta (para protección y rendimiento)
max-rows = 1000

# Clave secreta JWT (para autenticación con tokens de administrador)
jwt-secret = "clave_secreta_jwt_alpha_lash_minimo_32_caracteres_seguros_2026"
jwt-secret-is-base64 = false
